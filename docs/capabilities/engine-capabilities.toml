summary = "Optional scene EnvironmentDefinition resolves bounded project PNG/JPEG 2:1 equirectangular panoramas. Global linear ambient colour/intensity, solid background colour, skybox rotation and brightness persist in [environment]. GeometryRenderer uploads one optional panorama outside the frame loop and draws a fullscreen background before geometry, with perspective/orthographic rays independent of camera translation. Eight authored lights plus scene ambient are supported. Lighting page includes native scene preview, guarded validated saves, scene selection and project skybox swatches. Image Generator shares import, explicit candidate promotion, relabel and deletion with a Skybox category; default fal FLUX Schnell requests 1024x512, custom models require an advertised 2:1 size. LDR backgrounds only; HDR, image-based illumination, reflection probes and seamless AI output are not provided."
