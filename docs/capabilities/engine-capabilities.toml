[[capabilities]]
id = "project.manifest"
category = "assets"
name = "Game project manifest"
status = "available"
owner = "project"
depends_on = []
summary = "Versioned project metadata, asset roots, and selected OS output declarations."

[[capabilities]]
id = "project.host"
category = "tooling"
name = "Shared game project host"
status = "preview"
owner = "project_host"
depends_on = ["project.manifest"]
summary = "Engine-owned ProjectGame/main entry point supplies CLI catalogues, validation, previews, inspection and native Run for independent games. New-project source lives in templates/standard; native titles/logs use the loaded manifest name. Engine/template workspace validation and fixtures do not require a sample game. Formal host protocol versioning remains planned."

[[capabilities]]
id = "tools.project-workspace"
category = "tooling"
name = "Project creation and selection"
status = "preview"
owner = "ide"
depends_on = ["project.host"]
summary = "Explicit New/Open/recent project selection, template-based creation, duplication and project-scoped git snapshots. No implicit sample/template fallback; project pages show the chooser until selected. New games get independent Cargo workspaces, current template code, engine dependency paths and lockfile seed; EMERGENT_PROJECT_PATH pins selection."

[[capabilities]]
id = "render.native-surface"
category = "render-foundation"
name = "Native window and GPU surface"
status = "preview"
owner = "render"
depends_on = ["runtime.fixed-step"]
summary = "Optional winit window, wgpu device/surface, resize handling, and presentation."

[[capabilities]]
id = "render.depth-geometry"
category = "render-foundation"
name = "Depth-tested indexed geometry"
status = "preview"
owner = "render"
depends_on = ["render.native-surface", "world.transforms-3d"]
summary = "One indexed cube rendered from copied simulation transform data."

[[capabilities]]
id = "render.cameras"
category = "render-foundation"
name = "Cameras and viewports"
status = "preview"
owner = "render"
depends_on = ["render.native-surface", "world.transforms-3d"]
summary = "Entity-linked active cameras with perspective/FOV and orthographic projections, clipping planes, asset/instance inspector editing, a selected-camera frustum overlay, selection framing and alignment to the editor view. Viewports, layers and render targets remain planned."

[[capabilities]]
id = "render.extraction"
category = "render-foundation"
name = "Render extraction and passes"
status = "planned"
owner = "render"
depends_on = ["render.cameras", "ecs.schedules"]
summary = "Read-only world extraction, visibility, culling, batching, and ordered passes. Delivered so far: per-instance frustum culling in main and shadow passes, spatial index clusters for meshes of 16k+ triangles, and crack-free distance LOD for recognised terrain grids (GeometryRenderer::set_mesh_culling / set_mesh_lod bypasses, submitted_triangles stats). Extraction, batching and general mesh LOD remain planned."

[[capabilities]]
id = "geometry.point"
category = "geometry"
name = "Points"
status = "available"
owner = "geometry"
depends_on = ["render.native-surface"]
summary = "Validated finite points rendered as visible solid markers with explicit radius and colour."

[[capabilities]]
id = "geometry.line"
category = "geometry"
name = "Lines"
status = "available"
owner = "geometry"
depends_on = ["render.native-surface"]
summary = "Validated line segments rendered as solid prisms with explicit radius and colour."

[[capabilities]]
id = "geometry.polygon"
category = "geometry"
name = "Convex polygons"
status = "available"
owner = "geometry"
depends_on = ["render.native-surface"]
