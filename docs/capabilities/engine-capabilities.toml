[[capabilities]]
id = "terrain.raymarched-prototype"
category = "terrain"
name = "Bounded ray-marched terrain prototype"
status = "preview"
owner = "terrain"
depends_on = ["render.depth-geometry"]
summary = "Versioned RaymarchedTerrain fields: legacy v1 preserves 8..64m analytical fixtures; v2 defaults to 1024m biome terrain with 64..4096m extents, world-space biome scale, rolling plains, ridged mountains, bounded 3D rock displacement and winding cave carving. CPU/WGSL share seeded value noise and conservative distance bounds, with fixed trace caps. Procedural slope/elevation colours blend meadow/rock/snow. Region extent does not rescale features. Schema-1 entity assets use ordinary World components and up to eight renderer-scoped SlotMap regions. Terrain Builder shares a Height Field / Ray March switch and eight-biome modal. Explicit Plain/Hilly/Mountainous/Island/Rivers/Canyon/Underwater/CaveCavern fields persist as strings; missing biome retains mixed v2 output. A retained camera-only native worker supports live orbit/pan/zoom/projection with bounded inspection queues and lifecycle reaping. Recipe/seed/extent/relief/overhang/cave controls and guarded library/scene integration remain available. Physics and library material attachments remain unsupported; collision, lighting/shadow parity, streaming, LOD and broad performance acceptance remain open."

[[capabilities]]
id = "terrain.raymarch-diagnostics"
category = "terrain"
name = "Ray terrain bounds, diagnostics and preview quality"
status = "preview"
owner = "render"
depends_on = ["terrain.raymarched-prototype"]
summary = "Conservative clip-plane culling and projected scissor rectangles retain full-viewport fallback for near-plane intersections. Runtime RaymarchedRenderOptions toggles bounds and a step/exhaustion heatmap without changing authored recipes. Last-prepared region/submission/scissor-area statistics and a warmed release capture benchmark are available. Terrain Builder offers Auto/Full/Half quality, with half-resolution movement frames upscaled into the existing 960x540 protocol. Capture wall time includes GPU completion/readback; the separate render.gpu-pass-profiling capability adds GPU timestamps. Gameplay traversal/memory budgets and large-world acceptance remain open."

[[capabilities]]
id = "render.gpu-pass-profiling"
category = "render"
name = "Optional native offscreen GPU pass profiling"
status = "preview"
owner = "render"
depends_on = ["render.depth-geometry"]
summary = "Optional TIMESTAMP_QUERY support is requested only when advertised. Explicit blocking profile_lit_frame returns main/shadow GPU timings and separate CPU preparation/encoding/completion times, reusing diagnostic target/query/map buffers and preserving normal frame paths. Metal resolves are submitted after host-observed pass completion; zero/reversed counters fail explicitly. Unsupported devices return no sample. Uploaded geometry_buffer_bytes validates renderer-scoped generational handles and excludes materials/driver memory. A release native camera-route benchmark covers 1km/4km/eight ray regions, cavern and 128/512/1024 heightfields. Presentation, particle timing, allocator/driver memory and gameplay acceptance remain open."

[[capabilities]]
id = "procedural.noise"
category = "filters"
name = "Seeded noise generators"
status = "preview"
owner = "procedural"
depends_on = []
summary = "Version-1 seeded Perlin, OpenSimplex and distance-Worley with bounded octave composition, normalized 2D squares / full 3D cubes, prepared sampling and a validated project noise-filter definition. Pinned noise-rs 0.9.0. Value noise, domain warping and runtime terrain integration remain planned."

[[capabilities]]
id = "material.resources"
category = "materials"
name = "Materials and shaders"
status = "preview"
owner = "render"
depends_on = ["geometry.meshes"]
summary = "MaterialDefinition/Material: flat, smooth and unlit shading; linear albedo/specular/emission, shininess and noise-driven bump. Per-channel noise filters bake once into renderer-owned RGBA16Float volumes at selectable 32/64/128 resolution with a bounded bake budget; object-space bump gradients and radial sphere normals; dedicated Material Generator and schema-1 shared .material.toml library assets selected by objects. Nested material references are rejected. PBR and shader graphs remain planned."

