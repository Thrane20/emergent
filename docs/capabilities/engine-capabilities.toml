name = "Save data and replay"
status = "planned"
owner = "game-services"
depends_on = ["runtime.fixed-step", "assets.authored-worlds"]
summary = "Versioned save contracts, input recording, deterministic replay, and migration."

[[capabilities]]
id = "game.networking"
