[[capabilities]]
id = "geometry.vector"
category = "geometry"
name = "Vector and debug geometry"
status = "planned"
owner = "render"
depends_on = ["geometry.point", "geometry.line", "geometry.polygon", "render.cameras"]
summary = "Polylines, concave and outlined polygons, grids, axes, bounds, and debug gizmos."

[[capabilities]]
id = "geometry.primitives"
category = "geometry"
name = "Procedural 3D primitives"
status = "available"
owner = "geometry"
depends_on = ["geometry.meshes"]
summary = "Validated planes, cuboids, pyramids, UV spheres, cylinders, cones, capsules, and toruses with bounded tessellation. Authored planes default to a 1m-square mesh when half-extents are omitted, supporting scale-based sizing while preserving explicit legacy dimensions."

[[capabilities]]
id = "geometry.meshes"
category = "geometry"
name = "Indexed colour meshes"
status = "available"
owner = "render"
depends_on = ["render.native-surface"]
summary = "Validated coloured vertices, 32-bit triangle indices, renderer-owned buffers, and transformed instances."

[[capabilities]]
id = "geometry.models"
category = "geometry"
name = "Models and advanced meshes"
status = "planned"
owner = "render"
depends_on = ["geometry.meshes", "render.extraction"]
summary = "Normals, tangents, UVs, submeshes, bounds, model composition, and level of detail."

[[capabilities]]
id = "terrain.heightmap"
category = "terrain"
name = "Heightmap terrain"
status = "preview"
owner = "terrain"
depends_on = ["geometry.meshes", "procedural.noise"]
summary = "Versioned terrain entity assets generate bounded smooth meshes on scene load and optional static Rapier terrain heightfield colliders. Terrain Builder has a visual project terrain library with independent save/load/copy and revision-checked placement of shared assets into selected scenes; optional validated frozen heightfields feed both mesh and static collider. Chunk streaming, height-query API, polygonal terrain and LOD remain planned."

[[capabilities]]
id = "terrain.polygonal"
category = "terrain"
name = "Polygonal terrain"
status = "planned"
owner = "terrain"
depends_on = ["geometry.meshes", "procedural.noise"]
summary = "Arbitrary generated terrain surfaces with chunk and topology contracts."

[[capabilities]]
id = "terrain.raymarched-prototype"
category = "terrain"
name = "Bounded ray-marched terrain prototype"
status = "preview"
owner = "terrain"
depends_on = ["render.depth-geometry"]
summary = "Versioned RaymarchedTerrain fields: legacy v1 preserves 8..64m analytical fixtures; v2 defaults to 1024m biome terrain with 64..4096m extents, world-space biome scale, rolling plains, ridged mountains, bounded 3D rock displacement and winding cave carving. CPU/WGSL share seeded value noise and conservative distance bounds, with fixed trace caps. Procedural slope/elevation colours blend meadow/rock/snow. Region extent does not rescale features. Schema-1 entity assets use ordinary World components and up to eight renderer-scoped SlotMap regions. Terrain Builder shares a Height Field / Ray March switch and eight-biome modal. Explicit Plain/Hilly/Mountainous/Island/Rivers/Canyon/Underwater/CaveCavern fields persist as strings; missing biome retains mixed v2 output. A retained camera-only native worker supports live orbit/pan/zoom/projection with bounded inspection queues and lifecycle reaping. Recipe/seed/extent/relief/overhang/cave controls and guarded library/scene integration remain available. Physics and library material attachments remain unsupported; collision, lighting/shadow parity, streaming, LOD and broad performance acceptance remain open."

[[capabilities]]
id = "terrain.raymarch-diagnostics"
category = "terrain"
name = "Ray terrain bounds, diagnostics and preview quality"
status = "preview"
owner = "render"
depends_on = ["terrain.raymarched-prototype"]
summary = "Conservative clip-plane culling and projected scissor rectangles retain full-viewport fallback for near-plane intersections. Runtime RaymarchedRenderOptions toggles bounds, a step/exhaustion heatmap and distance-adaptive tracing (half-pixel hit tolerance, over-relaxed and long gap steps with a safe finish, on by default) without changing authored recipes. Last-prepared region/submission/scissor-area statistics and a warmed release capture benchmark are available. Terrain Builder offers Auto/Full/Half quality, with half-resolution movement frames upscaled into the existing 960x540 protocol. Capture wall time includes GPU completion/readback; the separate render.gpu-pass-profiling capability adds GPU timestamps. Gameplay traversal/memory budgets and large-world acceptance remain open."

[[capabilities]]
id = "render.gpu-pass-profiling"
category = "render"
name = "Optional native offscreen GPU pass profiling"
status = "preview"
owner = "render"
depends_on = ["render.depth-geometry"]
summary = "Optional TIMESTAMP_QUERY support is requested only when advertised. Explicit blocking profile_lit_frame returns main/shadow GPU timings and separate CPU preparation/encoding/completion times, reusing diagnostic target/query/map buffers and preserving normal frame paths. Metal resolves are submitted after host-observed pass completion; zero/reversed counters fail explicitly. Unsupported devices return no sample. Uploaded geometry_buffer_bytes validates renderer-scoped generational handles and excludes materials/driver memory. A release native camera-route benchmark covers 1km/4km/eight ray regions, cavern and 128/512/1024 heightfields. Presentation, particle timing, allocator/driver memory and gameplay acceptance remain open."

[[capabilities]]
id = "procedural.noise"
category = "filters"
name = "Seeded noise generators"
status = "preview"
owner = "procedural"
depends_on = []
summary = "Version-1 seeded Perlin, OpenSimplex and distance-Worley with bounded octave composition, normalized 2D squares / full 3D cubes, prepared sampling and a validated project noise-filter definition. Pinned noise-rs 0.9.0. Value noise, domain warping and runtime terrain integration remain planned."

[[capabilities]]
id = "material.resources"
category = "materials"
name = "Materials and shaders"
status = "preview"
owner = "render"
depends_on = ["geometry.meshes"]
summary = "MaterialDefinition/Material: flat, smooth and unlit shading; linear albedo/specular/emission, shininess and noise-driven bump. Per-channel noise filters bake once into renderer-owned RGBA16Float volumes at selectable 32/64/128 resolution with a bounded bake budget; object-space bump gradients and radial sphere normals; dedicated Material Generator and schema-1 shared .material.toml library assets selected by objects. Nested material references are rejected. Bounded surface shader graphs are a separate preview capability; PBR remains planned."

[[capabilities]]
id = "texture.resources"
category = "materials"
name = "Textures and samplers"
status = "planned"
owner = "render"
depends_on = ["render.native-surface"]
summary = "Colour, data, normal, environment, and render-target textures with sampler state."

[[capabilities]]
id = "lighting.sources"
category = "lighting"
name = "Light sources"
status = "preview"
owner = "lighting"
depends_on = ["world.entity-hierarchy", "world.transforms-3d", "ecs.schedules"]
summary = "Preview bounded renderer inputs for ambient, directional, point, and spot light entities; up to nine copied lights use Lambert illumination. Authored scenes retain eight entity-light slots so the ninth slot can hold scene ambient."

[[capabilities]]
id = "lighting.shadows"
category = "lighting"
name = "Shadows"
status = "planned"
owner = "render"
depends_on = ["lighting.sources", "render.extraction"]
summary = "One directional map plus two omnidirectional point-light maps (six 512-square faces each), with independent object cast/receive flags. Point lights use world position/range; extra shadow requests fail explicitly. Spot shadows, cascades, quality controls and culling remain planned."

[[capabilities]]
id = "effects.particles"
category = "effects"
name = "Particle systems and generator"
status = "preview"
owner = "effects"
depends_on = ["render.extraction", "texture.resources"]
summary = "Seeded bounded CPU pools owned through typed SlotMap handles; point/cone/box/sphere emitters, rate/bursts, forces, lifetime color/size/opacity, local/world space, alpha/additive instanced billboards, forward/ping-pong flipbooks and soft depth intersections. IDE Particle Generator saves/places/reopens layered effect assets and connects fal sprite/video/matting jobs to local atlas baking. GPU simulation, mesh particles, collision and trails remain planned."

[[capabilities]]
id = "animation.tweens"
category = "animation"
name = "Scalar tweens and easing editor"
status = "preview"
owner = "animation"
depends_on = ["world.transforms-3d"]
summary = "Headless scalar lerp with linear, sine, quadratic and cubic easing; explicit simulation-time sampling, once/loop/ping-pong playback, schema-1 reusable assets and an IDE motion/curve editor. Scene behaviour binding remains explicit game code."

[[capabilities]]
id = "animation.skeletal"
category = "animation"
name = "Skeletal animation"
status = "preview"
owner = "animation"
depends_on = ["geometry.meshes", "runtime.fixed-step"]
summary = "SKEL-1/2: glTF skins import as sorted, name-addressed skeletons with GPU linear blend skinning (4 influences, colour and shadow passes); glTF animations import as clips played by the emergent.animator component on the fixed tick; SKEL-3: humanoid bone detection, BVH mocap import and offline retargeting via the animator's motion field; SKEL-4: crossfade, ground-speed blend and in-place clips (locomotion drives movement); SKEL-5: two-bone and look-at IK, foot placement on physics ground, turn to movement, biped locomotion type and a template third-person mannequin scene; SKEL-6: IDE rigged-model/BVH import checked by the engine, rig report, skin-weight view and Meshy auto-rig via fal. Clip-driven root motion is planned (docs/plans/skeletal-animation.md)."

[[capabilities]]
id = "animation.shape-procedural"
category = "animation"
name = "Shape and procedural animation"
status = "planned"
owner = "animation"
depends_on = ["geometry.meshes", "runtime.fixed-step"]
summary = "Morph targets, timelines, curves, and procedural pose generation."

[[capabilities]]
id = "render.post-processing"
category = "effects"
name = "Post processing"
status = "planned"
owner = "render"
depends_on = ["render.extraction", "texture.resources"]
summary = "HDR, exposure, tone mapping, anti-aliasing, fog, bloom, and colour grading."

[[capabilities]]
id = "render.2d"
category = "2d-text"
name = "Sprites and tilemaps"
status = "planned"
owner = "render"
depends_on = ["render.cameras", "texture.resources"]
summary = "Sprite atlases, layers, tilemaps, and 2D camera conventions."

[[capabilities]]
id = "render.text"
category = "2d-text"
name = "Fonts and text"
status = "planned"
owner = "render"
depends_on = ["render.2d"]
summary = "Font assets, shaping, layout, and screen-space or world-space text."

[[capabilities]]
id = "audio.mixer"
category = "audio"
name = "Audio devices and mixer"
status = "preview"
owner = "audio"
depends_on = []
summary = "Default output device through cpal (macOS verified), lock-free allocation-free mixer, sfx/music/voice/ui bus gains, music ducking under speech, a send reverb, an output limiter, 32 real voices with quietest-first virtualisation. Device selection and per-bus effects remain planned."

[[capabilities]]
id = "audio.clips-streams"
category = "audio"
name = "Audio clips and streams"
status = "preview"
owner = "audio"
depends_on = ["audio.mixer", "assets.pipeline"]
summary = "Schema-1 .audio.toml clip assets (WAV, MP3, OGG Vorbis, FLAC; mono or stereo; trim, gain, loop points), decoded on a background loader thread; one-shot and looping playback with typed SoundId handles; fades; long clips (music by default) stream from disk on a decoder thread. The IDE /audio editor imports, trims, loops and previews clips and generates sound effects, music and speech with fal (also through MCP generate_audio). Music transitions remain planned."

[[capabilities]]
id = "audio.spatial"
category = "audio"
name = "Spatial audio"
status = "preview"
owner = "audio"
depends_on = ["audio.mixer", "world.transforms-3d"]
summary = "emergent.audio_source and emergent.audio_listener components (active camera listens by default), inverse/linear distance falloff, equal-power panning, Doppler from fixed-tick motion with teleport rejection. Brains can trigger clips by signal. The scene viewer draws a selected source's range. Occlusion and reverb zones remain planned."

[[capabilities]]
id = "behaviour.brains"
category = "simulation"
name = "Brains (steering trees)"
status = "preview"
owner = "brain"
depends_on = ["runtime.fixed-step", "world.transforms-3d"]
summary = "Saved trees of steering nodes (seek/flee, wander, patrol, flocking, formation, avoidance, evaluation and composition) attached with emergent.brain, evaluated deterministically each fixed tick against committed positions; groups via emergent.group; editor preview through the same runtime. Named brain modes run together while active and hand over on finish (On next) or abort (On previous), switched by Next/Previous/Switch mode nodes, signals and World::set_brain_mode; aircraft modes use Taxi, Take off, Hold course and Land nodes. Neighbour queries are linear; line of sight, obstacles and pathfinding are planned."

[[capabilities]]
id = "behaviour.locomotion"
category = "simulation"
name = "Locomotion"
status = "preview"
owner = "locomotion"
depends_on = ["behaviour.brains", "runtime.fixed-step"]
summary = "Profiles that carry out brain intent within physical limits: slide, wheeled (bicycle model), multirotor drone, fixed wing, ballistic and rocket, with published activity (steer, throttle, brake, bank, rotor, thrust, fuel). Kinematic models; legged/IK, rotorcraft, guided missiles and boats are planned."

[[capabilities]]
id = "control.pid"
category = "simulation"
name = "Fixed-step PID control"
status = "preview"
owner = "control"
depends_on = []
summary = "Reusable scalar control::Pid: validated configuration, explicit simulation duration, bounded integral/output, filtered derivative-on-measurement, caller feedforward and previous achieved actuator feedback, reset and P/I/D telemetry. Stepping, resetting and error paths allocate nothing. Full physics-driven drone pilot, wind and contact landing remain planned."

[[capabilities]]
id = "physics.locomotion-boundary"
category = "simulation"
name = "Physical locomotion boundary"
status = "preview"
owner = "locomotion"
depends_on = ["physics.world", "behaviour.locomotion"]
summary = "Unpowered drone_physics profile requires a dynamic PhysicsBody and physics feature. External force/torque commands drive it; committed PhysicsBodyState includes measured motion, mass, effective gravity and reconstruction revision. Mode-aware scene/runtime validation and reset handling preserve physics pose ownership. Catalogue status boundary is disabled in the editor; powered pilot, preview, wind and contact landing remain planned."

[[capabilities]]
id = "physics.fixed-wing"
category = "simulation"
name = "Physical fixed-wing aircraft"
status = "preview"
owner = "locomotion"
depends_on = ["physics.locomotion-boundary", "navigation.paths"]
summary = "fixed_wing_physics profiles fly a dynamic box body by forces and torques only: lift from lift-off speed and angle of attack with stall, parasitic and induced drag, spooled thrust, control-surface authority by dynamic pressure, and a wheel model (rolling resistance, brakes, tyre grip, nosewheel steering) on a frictionless collider. FlightGoal: Park, TakeOff, Hold (compass heading/altitude/speed), FlyTo, Taxi, Manual sticks (max bank 0 = aerobatics) and Land on a rectangular scene-map zone via a left-hand circuit, final with fixed nose-up attitude and PID power on a 3° glide path, flare, rollout and go-around. FlightTelemetry per tick; Taxi, Take off, Hold course and Land brain nodes; brain movement adapts to FlyTo/Park. Editor and MCP preview fly a Circuit course and report phases and touchdown; about 1 µs per aircraft per tick (release, physics included). Wind, crosswind landings and right-hand circuits remain planned."

[[capabilities]]
id = "navigation.airports"
category = "simulation"
name = "Airports and control tower"
status = "preview"
owner = "locomotion"
depends_on = ["physics.fixed-wing", "navigation.paths"]
summary = "Airports are scene-map items tagged aeroway=aerodrome|runway|threshold|taxiway|holding_position|parking_position|tower|holding_fix (OpenStreetMap values; threshold boxes set the landing ends and line-up point, taxiway lines auto-join where they cross or end within 15 m, unlinked stands and holding positions join the nearest line; aerodrome scale tag for miniature airports (circuits, heights, spacing and gates shrink; aircraft speed sets turn size); aeroway=circuit waypoint paths with leg tags and waypoint entry/exit course ranges and altitude replace the generated circuit for a runway end); runways take circuit=left|right, direction and active tags. FlightGoal::Arrive/Depart (and the Depart airport / Arrive at airport brain nodes) hand physical aircraft to a tower that sequences arrivals (four in the circuit, the rest stacked over a holding fix, base-turn spacing by remaining approach distance, landing clearance only on a clear runway, go-arounds re-sequenced), releases departures from the holding position, routes taxiing over the taxiway network and assigns free stands. Scene-map Airport tools place tagged items. Scene [wind] (speed, from) drives air-relative flight with crabbed crosswind approaches; towers land into the wind with tailwind hysteresis; the scene map overlays the landing direction, circuit legs, join point, holding fix and wind. Gusts, several active runways, live traffic on the map and ground collision avoidance remain planned."

[[capabilities]]
id = "input.actions"
category = "input"
name = "Input actions"
status = "preview"
owner = "input"
depends_on = ["runtime.fixed-step"]
summary = "Preview: deterministic per-tick keyboard snapshots (held/pressed/released for WASD, arrows, Space, Shift, Q, E) fed by the native window or a headless script. Pointer, gamepad, touch, action mapping and rebinding remain planned."

[[capabilities]]
id = "physics.world"
category = "simulation"
name = "Physics and collision"
status = "preview"
owner = "physics"
depends_on = ["world.transforms-3d", "ecs.schedules"]
summary = "Optional physics feature: Rapier static/dynamic bodies, gravity, per-fixed-tick force and torque application, fitted/explicit box colliders, static terrain heightfield colliders and fixed-tick contacts. IDE instance controls, terrain enablement/type selection and paused box collider outlines. Physics attributes update the retained inspection worker without restarting it. A character-controller drive (horizontal velocity, upright, grounded jump), linear-velocity, angular-velocity and reconstruction-aware committed body-state reads are available. Queries, other shapes, triggers and joints remain planned."

[[capabilities]]
id = "navigation.paths"
category = "simulation"
name = "Navigation and pathfinding"
status = "preview"
owner = "navigation"
depends_on = ["world.transforms-3d"]
summary = "Scene map (MAP-1): waypoint networks with A* routes weighted by zone travel costs, circle and rotated-rectangle zones with layers and blocked areas, name/value metadata queries, a grid index refreshed each tick. The top-down map editor can author scene or prefab-local waypoints, zones and metadata; spawned prefab copies resolve through World transforms. Already-expanded scene copies do not follow later prefab edits. Navmeshes and brain path nodes remain planned."

[[capabilities]]
id = "ui.assets"
category = "ui"
name = "UI assets and designer"
status = "preview"
owner = "ui"
depends_on = ["project.manifest"]
summary = "Schema-1 UI assets, bounded widget/tree validation, anchored and stacked layout, catalogue export, and the /ui designer with project library and Rust-validated saves/AI edits. MCP supports durable-ref discovery, widget catalogue, guarded create/edit, paged layout inspection and undo. Includes nested layouts, grid spans and auto content sizing; screen/world rendering is delivered in ui.runtime. Interaction remains planned. See docs/platform/ui-runtime-macos.md."

[[capabilities]]
id = "ui.runtime"
category = "ui"
name = "Runtime UI"
status = "preview"
owner = "ui"
depends_on = ["ui.assets", "geometry.meshes"]
summary = "Authored-state UI rendering through emergent.ui entities: screen overlays composited after the scene without depth, and unlit world panels with entity transforms and scene depth. Prepared RGBA surfaces include a built-in uppercase ASCII bitmap font and widget visuals. Scene placement buttons and generic host integration work for every project. Static prepared surfaces; pointer/ray input, action/value binding, focus, text editing and font shaping remain planned."

[[capabilities]]
id = "assets.pipeline"
category = "assets"
name = "Asset pipeline"
status = "planned"
owner = "assets"
depends_on = ["project.manifest"]
summary = "Import, metadata, dependency tracking, derived caches, hot reload, and variants."

[[capabilities]]
