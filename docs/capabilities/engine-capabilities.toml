schema_version = 1
engine_version = "0.11.0"
status_values = ["available", "preview", "planned"]

# This is a planning and discovery contract. Only `available` entries are stable
# enough to depend on; `preview` entries are usable experiments; `planned`
# entries name intended engine responsibilities without claiming an API exists.

[[capabilities]]
id = "runtime.fixed-step"
category = "runtime"
name = "Fixed-step runtime"
status = "available"
owner = "runtime"
depends_on = []
summary = "Bounded wall-clock catch-up and exact headless tick execution."

[[capabilities]]
id = "world.entity-hierarchy"
category = "world"
name = "Entity hierarchy"
status = "available"
owner = "world"
depends_on = []
summary = "SlotMap-owned entity identity, parent/child composition, and scene roots."

[[capabilities]]
id = "world.transforms-3d"
category = "world"
name = "3D transforms"
status = "available"
owner = "world"
depends_on = ["world.entity-hierarchy"]
summary = "Local and propagated global translation, rotation and scale, with a derived normalized world-space look direction."

[[capabilities]]
id = "behavior.typed-graph"
category = "behavior"
name = "Typed behaviour graph"
status = "available"
owner = "behavior"
depends_on = ["world.entity-hierarchy", "runtime.fixed-step"]
