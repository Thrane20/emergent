summary = "Rust triangle picking against rendered tessellation, light/node origin markers, unified scene selection, Local/Global XYZ translate/rotate/scale handles, transient previews, one validated save on release, Escape rollback, gesture tokens and external-edit rejection. Fixed 960x540 viewport; snapping, multi-select and undo remain planned."


[[capabilities]]
id = "tools.noise-filters"
category = "tooling"
name = "Noise filter asset inspector"
status = "preview"
owner = "ide"
depends_on = ["procedural.noise", "project.manifest", "tools.toml-authoring"]
summary = "Filters / Noise function creation, editable seeds and octave/domain inputs, grayscale generation via headless Rust, full 3D fields viewed as XY slices, separate guarded Save settings and raw TOML editing. Material channels consume noise filters through the material preview. Baked exports, runtime terrain consumers and filter composition graphs remain planned."


[[capabilities]]
id = "tools.terrain-builder"
category = "tooling"
name = "Terrain Builder preview"
status = "preview"
owner = "ide"
depends_on = ["procedural.noise", "project.manifest"]
summary = "Unified Height Field / Ray March controls with a shared eight-biome modal. Heightfields support Plain, Hilly, Mountainous, Rivers, Island, Canyon and Underwater seabed through the reusable Rust pipeline; enclosed Cave/Cavern requires Ray March. The ray-marched option uses a persistent native live orbit/pan/zoom preview, without saving draft assets. Perlin/diamond-square bases, bounded domain warp, multi-summit mountain groups/ridges and optional thermal erosion; matched three-way comparisons with generation/GLB preparation times and exact output sizes. Bounded 32–1024 grids (three-way comparisons capped at 256), smooth grayscale GLB, adjustable sun and orbit/zoom/reset. Top-down circular grayscale brushes raise/lower, smooth or flatten to a chosen height with radius/strength and one-stroke undo. Save to scene publishes the displayed versioned recipe and any frozen sculpted heightfield as a terrain entity asset and UUID scene instance with optional static terrain collider. Selected scene terrain opens through Edit terrain with exact saved samples or its procedural recipe; in-place saves preserve identity, placement and physics and update shared instances. Four library material slots support manual soft painting and an explicit height-band process with transition widths in local metres, per-process undo and exact blend-map save/reopen. Staged native validation and conflict checks precede publication. Water/hydraulic erosion, chunking and LOD remain planned."


[[capabilities]]
id = "terrain.generation"
category = "terrain"
name = "Headless terrain preparation"
status = "preview"
owner = "terrain"
depends_on = ["geometry.meshes", "procedural.noise"]
summary = "TerrainSettings validates/serializes independent-patch recipes, defaulting to algorithm v2 mountain massifs with uneven summits/saddles/shoulders while preserving explicit v1 output. generate returns an owned TerrainField with world-space heights and a smooth Mesh conversion; from_heights validates frozen authored samples. Perlin and diamond-square, controlled main peaks/ridges, domain warp, bounded conservative thermal erosion. This is preparation outside the game loop; no new identity owner, streaming, saved terrain loader or collider. Continuous worlds: TerrainWorld (versioned, bounded, centred chunk grid) prepares owned 129-sample TerrainChunks on one global i64 lattice with halo central-difference normals, so neighbouring chunk borders match exactly; chunk-local meshes with f64 origins. height_band_weights and Material::terrain_blend give world-continuous height-band materials (triplanar images with a wrapped world projection offset; noise-map layers rejected); a rendered 2x2 fixture matches one merged mesh. No chunk storage, chunk LOD selection, streaming or collision yet."


[[capabilities]]
id = "materials.diffuse-images"
category = "render"
name = "Diffuse image textures and terrain material palette"
status = "preview"
owner = "render"
depends_on = ["geometry.meshes", "project.manifest"]
summary = "PNG/JPEG diffuse_map references, bounded native decoding, sRGB colour sampling, gamma-correct mipmaps, per-material X/Y texture tiling and object-space triplanar repeat. Live image swatches and project import; terrain instances retain up to eight named layers with one active whole-surface material. Legacy image palettes remain supported. New terrain paint sidecars blend up to four complete library materials through RGBA weights, with soft manual brushes and height-based river-bed/ground/mountain/summit transitions. Terrain images share a 1024-pixel array and noise maps are capped at 64 cubed per layer. The IDE preview shows diffuse colours/images; native inspection renders all channels. Slope rules, alpha cutouts, shared texture caching and UV authoring remain future work."


[[capabilities]]
id = "tools.texture-creator"
category = "tooling"
name = "AI texture creation"
status = "preview"
owner = "ide"
depends_on = ["project.manifest", "materials.diffuse-images"]
summary = "Prompt-based fal FLUX.1 Schnell batches with shared local fal credentials, durable queue history, bounded native-validated previews and selected-result saves. Generated PNG/JPEG assets and provenance sidecars enter existing object/terrain material pickers. Paid submissions are claimed once; uncertain outcomes are not automatically resubmitted. Tile-friendly prompts do not guarantee seamless images; painting/blending remain separate work."

[[capabilities]]
id = "geometry.authored-structures"
category = "geometry"
name = "Editable polygon structure assets"
status = "preview"
owner = "geometry"
depends_on = ["geometry.meshes", "assets.authored-worlds"]
summary = "Schema-1 StructureDefinition authoring graphs retain durable part IDs, local TRS, shared polygon vertices and faces. Bounded dominant-plane ear clipping supports simple concave polygons; hierarchy cycles, invalid topology, singular transforms and degenerate triangles are rejected. Preparation compiles parts into one ordinary Mesh on the existing World EntityId/renderer GeometryId, including reflection winding. A structure entity references its editable .structure.toml sidecar. Per-part runtime behaviours, booleans and mesh streaming remain outside this contract."

[[capabilities]]
id = "tools.object-builder"
category = "ide"
name = "Object Builder"
status = "preview"
owner = "ide"
depends_on = ["geometry.authored-structures", "material.resources"]
summary = "Primitive palette, local hierarchy drag/reparent/reorder with cycle guards and keyboard alternatives, object/face/point picking and direct 3D dragging, XYZ handles, object rotate/scale, face extrusion with connected side faces, centroid-based percentage inset, bounded undo/redo and metre-based numeric controls. Editable topology saves to the structure library, places in scenes and reopens from Edit object. Shared library materials apply to the assembled mesh. Journal publication follows staged native validation and revision checks. The browser viewport is a geometry preview; full surface shading is rendered natively."

[[capabilities]]
id = "scene.environment"
category = "graphics"
name = "Scene global lighting and panoramic skyboxes"
status = "available"
owner = "scene"
depends_on = ["project.manifest", "lighting.sources", "render.depth-geometry"]
summary = "Optional scene EnvironmentDefinition resolves bounded project PNG/JPEG 2:1 equirectangular panoramas. Global linear ambient colour/intensity, solid background colour, skybox rotation and brightness persist in [environment]. GeometryRenderer uploads one optional panorama outside the frame loop and draws a fullscreen background before geometry, with perspective/orthographic rays independent of camera translation. Eight authored lights plus scene ambient are supported. Lighting page includes native scene preview, guarded validated saves, scene selection and project skybox swatches. Image Generator shares import, explicit candidate promotion, relabel and deletion with a Skybox category; default fal FLUX Schnell requests 1024x512, custom models require an advertised 2:1 size. LDR backgrounds only; HDR, image-based illumination, reflection probes and seamless AI output are not provided."

[[capabilities]]
id = "assets.prefabs"
category = "assets"
name = "Named prefab object graphs"
status = "preview"
owner = "project"
depends_on = ["assets.authored-worlds", "world.entity-hierarchy"]
summary = "Project-scoped schema-1 single-root prefab assets reuse authored entities and components. IDE drag-to-capture and a scrollable table with drag/keyboard scene placement preserve local hierarchy and remap internal entity links, including shared brains through validated instance bindings. Rust PrefabDefinition loads by path or unique exact label and spawns repeated independently named graphs with fresh World SlotMap handles and a local member map. Bounds: 1024 members, 256 KiB. No automatic propagation to placed copies, recursive prefabs, or audio implementation."

[[capabilities]]
id = "ui.layouts"
category = "ui"
name = "Nested grid and linear UI layouts"
status = "preview"
owner = "ui"
depends_on = ["ui.assets"]
summary = "Horizontal, Vertical and Grid containers, plus panel layout modes, nest through existing validated UI parent links. Width/height in px or percentages, uniform padding, gaps, main/cross alignment and cross stretch. Grid uses 1–64 columns and equal cells. Native and browser geometry share golden fixtures; legacy stacks are retained. Includes ordered non-overlapping column/row spans (at most 512 rows), auto content dimensions, and native screen/world rendering; flex growth remains planned."

[[capabilities]]
id = "input.first-person"
category = "input"
name = "First-person controller"
status = "preview"
owner = "runtime"
depends_on = []
summary = "Active-camera relative mouse look, native click capture and Escape/focus release, camera-relative WASD and supporting-contact jumps through existing dynamic box physics. Standard template includes a player prefab and collision walk scene. Hardware calibration, capsule/stair and platform policies remain open."

[[capabilities]]
id = "render.shader-graphs"
category = "render"
name = "Surface shader assets and editor"
status = "preview"
owner = "render"
depends_on = ["material.resources"]
summary = "Schema-1 project .shader.toml scalar DAGs compile to native WGSL on resource preparation: up to 32 nodes and 16 scalar parameters, time/position/UV/Fresnel/noise/math, colour/emission/opacity/normal-direction displacement. Materials reference shaders and named overrides. IDE wired node canvas (drag-to-connect sockets, saved card positions, auto-layout), library, undo, orbitable animated preview, AI draft edits using configured providers, guarded native-validated saves and material creation; MCP list_shader_nodes/describe/create_shader/edit_shader. Force-field/water/dissolve templates and a native showcase ship in the standard template. Material selection updates retained inspection in place. Transparent objects sort by origin with depth writes off. Arbitrary WGSL, textures in graphs, normal outputs, depth/refraction, animated shadow casting, impact inputs and gameplay parameter bindings remain open; displacement does not alter collision."

[[capabilities]]
id = "world.object-classification"
category = "world"
name = "Object layers and tags"
status = "preview"
owner = "world"
depends_on = ["world.entity-hierarchy"]
summary = "ObjectClassification component stores a single layer index and u32 tag mask on existing entities. Project asset-root object-labels.toml configures up to 32 stable slots per list; blank slots stay reserved. Inspector offers layer/tag dropdowns, a multi-select tag dialog and fixed-slot configuration, with guarded native validation and live retained-inspection writes. Asset defaults and scene/prefab overrides persist. Undefined slots fail loading. Collision matrices, camera masks and automatic brain filtering are not connected."

[[capabilities]]
id = "tools.model-box-cut"
category = "tooling"
name = "Model Parts box surface subtraction"
status = "preview"
owner = "ide"
depends_on = ["project.manifest", "assets.authored-worlds"]
summary = "View-aligned rectangle creates an oriented box with depth equal to width; eight projected 3D corner handles, orbit-relative resizing, keyboard steps and numeric local centre/size controls precede explicit Cut. Intersected part surfaces are clipped against six box planes with UV/normal interpolation, no unused output vertices and unchanged surviving IDs/pivots/materials. Fully removed parts reparent children coherently; whole-model removal is refused. Bounded to native per-part geometry limits, with staged native save validation and save/reopen browser evidence. Save To Object Library also publishes a stable hierarchy prefab, listed beside structures and reopened in Model Parts or placed through shared prefab placement. Open edges remain uncapped; solid booleans and measured large-model latency are not provided. See docs/platform/model-box-cut.md."
