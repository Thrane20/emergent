status = "preview"
owner = "project"
depends_on = ["project.manifest", "world.entity-hierarchy", "behavior.typed-graph"]
summary = "Schema-1 primitive/light/empty-node assets and explicit scene instances with transform and local display-name overrides, durable IDs, validated hierarchy and fresh SlotMap instantiation. Named single-root prefabs support validated subtree capture, fresh-ID snapshot placement, per-instance brain bindings and reusable runtime spawning. Recursive/linked prefab composition and authored behaviour-port links remain planned."

[[capabilities]]
