[[capabilities]]
id = "tools.scene-transforms"
category = "tools"
name = "Scene-instance Transform inspector"
status = "preview"
owner = "tools"
depends_on = ["assets.authored-worlds", "tools.scene-preview"]
summary = "Scene-first hierarchy, keep-local drag/drop and keyboard parenting, Local/Global TRS editing through Rust World math, uniform scale, reset, revision checks and Rust candidate validation. Sheared global transforms expose position only. Picking and axis gizmos are available in persistent inspection; undo/redo remains planned."

[[capabilities]]
id = "tools.persistent-inspection"
category = "tooling"
name = "Persistent native inspection session"
status = "preview"
owner = "ide"
depends_on = ["tools.scene-preview", "world.transforms-3d", "assets.authored-worlds"]
summary = "Retained native tick-zero world/renderer, 960x540 latest-frame PNG delivery targeting 30 Hz, acknowledged orbit/pan/zoom and saved instance edits, stale-session protection and process leases. Mac Metal prototype measured; production video remains planned. Picking and axis gizmos are a separate delivered slice."


[[capabilities]]
id = "tools.toml-authoring"
category = "tooling"
name = "Validated scene and entity TOML editor"
status = "preview"
owner = "ide"
depends_on = ["assets.authored-worlds", "tools.scene-transforms"]
summary = "Whole-file scene/shared-entity/noise-filter TOML editing beside Overview, Connections and Source; staged Cargo and all-scene Rust validation, shared-asset checks, bounded source, revision guards and unsaved-draft protection. Load/Restart inspection applies raw source changes."


[[capabilities]]
id = "tools.viewport-gizmos"
category = "tooling"
name = "Viewport picking and transform gizmos"
status = "preview"
owner = "ide"
depends_on = ["tools.persistent-inspection", "tools.scene-transforms", "geometry.meshes"]
summary = "Rust triangle picking against rendered tessellation, light/node origin markers, unified scene selection, Local/Global XYZ translate/rotate/scale handles, transient previews, one validated save on release, Escape rollback, gesture tokens and external-edit rejection. Fixed 960x540 viewport; snapping, multi-select and undo remain planned."


[[capabilities]]
id = "tools.noise-filters"
category = "tooling"
name = "Noise filter asset inspector"
status = "preview"
owner = "ide"
depends_on = ["procedural.noise", "project.manifest", "tools.toml-authoring"]
summary = "Filters / Noise function creation, editable seeds and octave/domain inputs, grayscale generation via headless Rust, full 3D fields viewed as XY slices, separate guarded Save settings and raw TOML editing. Material channels consume noise filters through the material preview. Baked exports, runtime terrain consumers and filter composition graphs remain planned."


[[capabilities]]
id = "tools.terrain-builder"
category = "tooling"
name = "Terrain Builder preview"
status = "preview"
owner = "ide"
depends_on = ["procedural.noise", "project.manifest"]
summary = "Unified Height Field / Ray March controls with a shared eight-biome modal. Heightfields support Plain, Hilly, Mountainous, Rivers, Island, Canyon and Underwater seabed through the reusable Rust pipeline; enclosed Cave/Cavern requires Ray March. The ray-marched option uses a persistent native live orbit/pan/zoom preview, without saving draft assets. Perlin/diamond-square bases, bounded domain warp, multi-summit mountain groups/ridges and optional thermal erosion; matched three-way comparisons with generation/GLB preparation times and exact output sizes. Bounded 32–1024 grids (three-way comparisons capped at 256), smooth grayscale GLB, adjustable sun and orbit/zoom/reset. Top-down circular grayscale brushes raise/lower, smooth or flatten to a chosen height with radius/strength and one-stroke undo. Save to scene publishes the displayed versioned recipe and any frozen sculpted heightfield as a terrain entity asset and UUID scene instance with optional static terrain collider. Selected scene terrain opens through Edit terrain with exact saved samples or its procedural recipe; in-place saves preserve identity, placement and physics and update shared instances. Four library material slots support manual soft painting and an explicit height-band process with transition widths in local metres, per-process undo and exact blend-map save/reopen. Staged native validation and conflict checks precede publication. Water/hydraulic erosion, chunking and LOD remain planned."


[[capabilities]]
id = "terrain.generation"
category = "terrain"
name = "Headless terrain preparation"
status = "preview"
owner = "terrain"
depends_on = ["geometry.meshes", "procedural.noise"]
summary = "TerrainSettings validates/serializes independent-patch recipes, defaulting to algorithm v2 mountain massifs with uneven summits/saddles/shoulders while preserving explicit v1 output. generate returns an owned TerrainField with world-space heights and a smooth Mesh conversion; from_heights validates frozen authored samples. Perlin and diamond-square, controlled main peaks/ridges, domain warp, bounded conservative thermal erosion. This is preparation outside the game loop; no new identity owner, streaming, saved terrain loader, collider or seamless edge contract."


[[capabilities]]
id = "materials.diffuse-images"
category = "render"
name = "Diffuse image textures and terrain material palette"
status = "preview"
owner = "render"
depends_on = ["geometry.meshes", "project.manifest"]
summary = "PNG/JPEG diffuse_map references, bounded native decoding, sRGB colour sampling, gamma-correct mipmaps and object-space triplanar repeat. Live image swatches and project import; terrain instances retain up to eight named layers with one active whole-surface material. Legacy image palettes remain supported. New terrain paint sidecars blend up to four complete library materials through RGBA weights, with soft manual brushes and height-based river-bed/ground/mountain/summit transitions. Terrain images share a 1024-pixel array and noise maps are capped at 64 cubed per layer. The IDE preview shows diffuse colours/images; native inspection renders all channels. Slope rules, alpha cutouts, shared texture caching and UV authoring remain future work."


[[capabilities]]
id = "tools.texture-creator"
category = "tooling"
name = "AI texture creation"
status = "preview"
owner = "ide"
depends_on = ["project.manifest", "materials.diffuse-images"]
summary = "Prompt-based fal FLUX.1 Schnell batches with shared local fal credentials, durable queue history, bounded native-validated previews and selected-result saves. Generated PNG/JPEG assets and provenance sidecars enter existing object/terrain material pickers. Paid submissions are claimed once; uncertain outcomes are not automatically resubmitted. Tile-friendly prompts do not guarantee seamless images; painting/blending remain separate work."

[[capabilities]]
id = "geometry.authored-structures"
category = "geometry"
name = "Editable polygon structure assets"
status = "preview"
owner = "geometry"
depends_on = ["geometry.meshes", "assets.authored-worlds"]
summary = "Schema-1 StructureDefinition authoring graphs retain durable part IDs, local TRS, shared polygon vertices and faces. Bounded dominant-plane ear clipping supports simple concave polygons; hierarchy cycles, invalid topology, singular transforms and degenerate triangles are rejected. Preparation compiles parts into one ordinary Mesh on the existing World EntityId/renderer GeometryId, including reflection winding. A structure entity references its editable .structure.toml sidecar. Per-part runtime behaviours, booleans and mesh streaming remain outside this contract."

[[capabilities]]
id = "tools.object-builder"
category = "ide"
name = "Object Builder"
status = "preview"
owner = "ide"
depends_on = ["geometry.authored-structures", "material.resources"]
summary = "Primitive palette, local hierarchy drag/reparent/reorder with cycle guards and keyboard alternatives, object/face/point picking and direct 3D dragging, XYZ handles, object rotate/scale, face extrusion with connected side faces, centroid-based percentage inset, bounded undo/redo and metre-based numeric controls. Editable topology saves to the structure library, places in scenes and reopens from Edit object. Shared library materials apply to the assembled mesh. Journal publication follows staged native validation and revision checks. The browser viewport is a geometry preview; full surface shading is rendered natively."

[[capabilities]]
